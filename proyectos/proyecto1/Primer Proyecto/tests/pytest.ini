[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    benchmark: Prueba de rendimiento/latencia (puede ser lenta)
    integration: Requiere Cassandra activa
    unit: No requiere infraestructura
addopts =
    -v
    --tb=short
    --color=yes
    -p no:warnings
    --durations=10
log_cli = true
log_cli_level = INFO
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
