<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}AeroCluster{% endblock %} — Sistema de Reservas</title>
  <meta name="description" content="Dashboard de gestión de reservas aéreas sobre Apache Cassandra" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <style>
    /* ── Design Tokens ────────────────────────────────────────── */
    :root {
      --bg-base:        #0a0e1a;
      --bg-surface:     #111827;
      --bg-card:        #1a2235;
      --bg-card-hover:  #1f2b42;
      --accent:         #4f8ef7;
      --accent-glow:    rgba(79,142,247,.25);
      --accent2:        #7c5af7;
      --success:        #22d3a5;
      --warning:        #f59e0b;
      --danger:         #ef4444;
      --text-primary:   #e8eaf0;
      --text-secondary: #8892a4;
      --text-muted:     #4b5568;
      --border:         rgba(255,255,255,.07);
      --radius:         12px;
      --radius-sm:      8px;
      --font:           'Inter', sans-serif;
      --font-mono:      'JetBrains Mono', monospace;
      --nav-h:          64px;
      --sidebar-w:      240px;
      --transition:     .2s ease;
    }

    /* ── Reset & Base ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font);
      background: var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Scrollbar ────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-base); }
    ::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 3px; }

    /* ── Topbar ───────────────────────────────────────────────── */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      height: var(--nav-h);
      background: rgba(10,14,26,.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px;
    }
    .topbar-brand {
      display: flex; align-items: center; gap: 10px;
      font-weight: 700; font-size: 1.1rem; color: var(--text-primary);
      text-decoration: none;
    }
    .topbar-brand .logo {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; color: #fff;
      box-shadow: 0 0 20px var(--accent-glow);
    }
    .topbar-badge {
      font-size: .65rem; font-weight: 600; letter-spacing: .05em;
      background: var(--accent-glow); border: 1px solid var(--accent);
      color: var(--accent); border-radius: 20px; padding: 2px 8px;
    }

    /* ── Sidebar ──────────────────────────────────────────────── */
    .sidebar {
      position: fixed; top: var(--nav-h); left: 0; bottom: 0;
      width: var(--sidebar-w);
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
      padding: 20px 12px;
      overflow-y: auto;
    }
    .sidebar-section-label {
      font-size: .65rem; font-weight: 600; letter-spacing: .12em;
      text-transform: uppercase; color: var(--text-muted);
      padding: 8px 12px 4px;
    }
    .nav-link-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px; border-radius: var(--radius-sm);
      color: var(--text-secondary); text-decoration: none;
      font-size: .875rem; font-weight: 500;
      transition: all var(--transition);
      margin-bottom: 2px;
    }
    .nav-link-item:hover {
      background: var(--bg-card-hover); color: var(--text-primary);
    }
    .nav-link-item.active {
      background: var(--accent-glow); color: var(--accent);
      border: 1px solid rgba(79,142,247,.2);
    }
    .nav-link-item i { width: 18px; text-align: center; font-size: 1rem; }

    /* ── Main Content ─────────────────────────────────────────── */
    .main-content {
      margin-left: var(--sidebar-w);
      margin-top: var(--nav-h);
      padding: 32px 28px;
      flex: 1;
    }

    /* ── Page Header ──────────────────────────────────────────── */
    .page-header { margin-bottom: 28px; }
    .page-header h1 {
      font-size: 1.6rem; font-weight: 700; color: var(--text-primary);
      display: flex; align-items: center; gap: 10px;
    }
    .page-header p { color: var(--text-secondary); font-size: .9rem; margin-top: 4px; }

    /* ── Cards ────────────────────────────────────────────────── */
    .card-glass {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      transition: all var(--transition);
    }
    .card-glass:hover { border-color: rgba(79,142,247,.2); }

    /* ── Metric Cards ─────────────────────────────────────────── */
    .metric-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      position: relative; overflow: hidden;
      transition: transform var(--transition), border-color var(--transition);
    }
    .metric-card:hover { transform: translateY(-2px); border-color: rgba(79,142,247,.3); }
    .metric-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 2px;
    }
    .metric-card.blue::before   { background: linear-gradient(90deg, var(--accent), transparent); }
    .metric-card.purple::before { background: linear-gradient(90deg, var(--accent2), transparent); }
    .metric-card.green::before  { background: linear-gradient(90deg, var(--success), transparent); }
    .metric-card.amber::before  { background: linear-gradient(90deg, var(--warning), transparent); }
    .metric-card .metric-icon {
      width: 40px; height: 40px; border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; margin-bottom: 12px;
    }
    .metric-card.blue   .metric-icon { background: rgba(79,142,247,.15); color: var(--accent); }
    .metric-card.purple .metric-icon { background: rgba(124,90,247,.15); color: var(--accent2); }
    .metric-card.green  .metric-icon { background: rgba(34,211,165,.15); color: var(--success); }
    .metric-card.amber  .metric-icon { background: rgba(245,158,11,.15); color: var(--warning); }
    .metric-value { font-size: 1.8rem; font-weight: 700; line-height: 1; }
    .metric-label { font-size: .8rem; color: var(--text-secondary); margin-top: 4px; }

    /* ── Forms ────────────────────────────────────────────────── */
    .form-label { font-size: .8rem; font-weight: 500; color: var(--text-secondary); margin-bottom: 4px; }
    .form-control, .form-select {
      background: var(--bg-base) !important;
      border: 1px solid var(--border) !important;
      color: var(--text-primary) !important;
      border-radius: var(--radius-sm) !important;
      font-size: .875rem;
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    .form-control:focus, .form-select:focus {
      border-color: var(--accent) !important;
      box-shadow: 0 0 0 3px var(--accent-glow) !important;
      outline: none !important;
    }
    .form-control::placeholder { color: var(--text-muted) !important; }

    /* ── Buttons ──────────────────────────────────────────────── */
    .btn-primary-custom {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none; color: #fff;
      padding: 8px 20px; border-radius: var(--radius-sm);
      font-size: .875rem; font-weight: 600;
      cursor: pointer; transition: opacity var(--transition), transform var(--transition);
      display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-primary-custom:hover { opacity: .88; transform: translateY(-1px); }

    /* ── Tables ───────────────────────────────────────────────── */
    .table-wrapper { overflow-x: auto; }
    .data-table {
      width: 100%; border-collapse: collapse;
      font-size: .85rem;
    }
    .data-table thead tr {
      background: var(--bg-base);
      border-bottom: 1px solid var(--border);
    }
    .data-table th {
      padding: 10px 14px; text-align: left;
      font-size: .7rem; font-weight: 600; letter-spacing: .08em;
      text-transform: uppercase; color: var(--text-muted);
    }
    .data-table tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background var(--transition);
    }
    .data-table tbody tr:hover { background: var(--bg-card-hover); }
    .data-table tbody tr:last-child { border-bottom: none; }
    .data-table td { padding: 10px 14px; color: var(--text-secondary); }
    .data-table td .mono { font-family: var(--font-mono); font-size: .8rem; color: var(--text-muted); }

    /* ── Badges ───────────────────────────────────────────────── */
    .badge-status {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: .72rem; font-weight: 600; letter-spacing: .04em;
      padding: 3px 10px; border-radius: 20px;
    }
    .badge-status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; }
    .badge-status.confirmada, .badge-status.pagado, .badge-status.completado {
      background: rgba(34,211,165,.12); color: var(--success);
    }
    .badge-status.confirmada::before, .badge-status.pagado::before, .badge-status.completado::before {
      background: var(--success);
    }
    .badge-status.pendiente {
      background: rgba(245,158,11,.12); color: var(--warning);
    }
    .badge-status.pendiente::before { background: var(--warning); }
    .badge-status.cancelada, .badge-status.reembolsado {
      background: rgba(239,68,68,.12); color: var(--danger);
    }
    .badge-status.cancelada::before, .badge-status.reembolsado::before { background: var(--danger); }
    .badge-status.retrasado {
      background: rgba(245,158,11,.12); color: var(--warning);
    }
    .badge-status.primera    { background: rgba(124,90,247,.15); color: var(--accent2); }
    .badge-status.ejecutiva  { background: rgba(79,142,247,.15); color: var(--accent); }
    .badge-status.economica  { background: rgba(34,211,165,.15); color: var(--success); }
    .badge-status.primera::before, .badge-status.ejecutiva::before, .badge-status.economica::before { display: none; }

    /* ── Node Status Dots ─────────────────────────────────────── */
    .node-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .node-dot.up { background: var(--success); box-shadow: 0 0 6px var(--success); }
    .node-dot.down { background: var(--danger); box-shadow: 0 0 6px var(--danger); }

    /* ── Alert Banner ─────────────────────────────────────────── */
    .alert-custom {
      padding: 12px 16px; border-radius: var(--radius-sm);
      font-size: .875rem; display: flex; align-items: center; gap: 8px;
    }
    .alert-custom.error { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3); color: #f87171; }
    .alert-custom.info  { background: rgba(79,142,247,.1); border: 1px solid rgba(79,142,247,.3); color: #93c5fd; }

    /* ── Progress Bar ─────────────────────────────────────────── */
    .progress-bar-custom {
      height: 8px; border-radius: 4px;
      background: var(--bg-base); overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%; border-radius: 4px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width .6s ease;
    }
    .progress-bar-fill.high  { background: linear-gradient(90deg, var(--danger), #f97316); }
    .progress-bar-fill.medium { background: linear-gradient(90deg, var(--warning), #fb923c); }

    /* ── Empty State ──────────────────────────────────────────── */
    .empty-state {
      text-align: center; padding: 48px 24px;
      color: var(--text-muted);
    }
    .empty-state i { font-size: 3rem; opacity: .3; margin-bottom: 12px; display: block; }
    .empty-state p { font-size: .9rem; }

    /* ── Animations ───────────────────────────────────────────── */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeInUp .4s ease both; }
    .fade-in-delay-1 { animation-delay: .05s; }
    .fade-in-delay-2 { animation-delay: .1s; }
    .fade-in-delay-3 { animation-delay: .15s; }
    .fade-in-delay-4 { animation-delay: .2s; }

    /* ── Chart container ──────────────────────────────────────── */
    .chart-container { position: relative; }
  </style>

  {% block extra_head %}{% endblock %}
</head>
<body>

  <!-- ── Topbar ─────────────────────────────────────────────── -->
  <nav class="topbar">
    <a href="/" class="topbar-brand">
      <div class="logo"><i class="bi bi-airplane-fill"></i></div>
      <span>AeroCluster</span>
      <span class="topbar-badge">Cassandra 4.1</span>
    </a>
    <div class="d-flex align-items-center gap-3">
      <span id="cluster-badge" class="topbar-badge" style="background:rgba(34,211,165,.1);border-color:var(--success);color:var(--success)">
        <i class="bi bi-circle-fill" style="font-size:.5rem"></i> Clúster activo
      </span>
    </div>
  </nav>

  <!-- ── Sidebar ────────────────────────────────────────────── -->
  <aside class="sidebar">
    <div class="sidebar-section-label">General</div>
    <a href="/" class="nav-link-item {% if request.path == '/' %}active{% endif %}">
      <i class="bi bi-grid-1x2-fill"></i> Dashboard
    </a>

    <div class="sidebar-section-label mt-3">Consultas CQL</div>
    <a href="/q1" class="nav-link-item {% if request.path == '/q1' %}active{% endif %}">
      <i class="bi bi-layout-three-columns"></i>
      <span>Q1 — Disponibilidad</span>
    </a>
    <a href="/q2" class="nav-link-item {% if request.path == '/q2' %}active{% endif %}">
      <i class="bi bi-clock-history"></i>
      <span>Q2 — Historial</span>
    </a>
    <a href="/q3" class="nav-link-item {% if request.path == '/q3' %}active{% endif %}">
      <i class="bi bi-people-fill"></i>
      <span>Q3 — Manifiesto</span>
    </a>
    <a href="/q4" class="nav-link-item {% if request.path == '/q4' %}active{% endif %}">
      <i class="bi bi-graph-up-arrow"></i>
      <span>Q4 — Ocupación</span>
    </a>
    <a href="/q5" class="nav-link-item {% if request.path == '/q5' %}active{% endif %}">
      <i class="bi bi-trophy-fill"></i>
      <span>Q5 — Top Ingresos</span>
    </a>
  </aside>

  <!-- ── Main ───────────────────────────────────────────────── -->
  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script>
    // Configuración global de Chart.js para dark theme
    Chart.defaults.color = '#8892a4';
    Chart.defaults.borderColor = 'rgba(255,255,255,0.07)';
    Chart.defaults.font.family = "'Inter', sans-serif";
  </script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
